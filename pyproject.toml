[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "notes-rag"
version = "0.1.0"
description = "Day-2 AI build: RAG over a folder of Markdown notes — retrieve, cite, answer (mockable)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PrimeOdin" }]
dependencies = []
[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
notes-rag = "notes_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
